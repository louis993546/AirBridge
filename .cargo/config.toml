[build]
target = "riscv32imafc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor --chip esp32p4 --flash-size 16mb --partition-table partitions.csv"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32p4"
ESP_IDF_VERSION = "v5.5.3"
# Portable default for standalone clones. To reuse an existing ESP-IDF v5.5.3 install without
# re-downloading ~5 GB, override in your shell:
#   ESP_IDF_TOOLS_INSTALL_DIR="custom:../hello-new-world/.embuild/espressif"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
